<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teilapparat Pro // MŰHELY OS</title>
    <style>
        :root { --bg:#0a0e14; --panel:#131922; --card:#1a222d; --cyan:#00f0ff; --orange:#ff6b00; --green:#00e676; --text:#e6edf3; --muted:#8b949e; --border:#2d3748; }
        * { box-sizing:border-box; margin:0; padding:0; font-family:sans-serif; }
        body { background:var(--bg); color:var(--text); padding-bottom:3rem; }
        header { background:var(--panel); border-bottom:1px solid var(--border); padding:1rem; display:flex; justify-content:space-between; align-items:center; }
        .back-btn { color:var(--cyan); text-decoration:none; font-weight:bold; padding:6px 12px; border:1px solid var(--cyan); border-radius:6px; }
        main { max-width:800px; margin:0 auto; padding:1rem; }
        .tabs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:1rem; }
        .tab-btn { background:var(--panel); border:1px solid var(--border); color:var(--muted); padding:12px 6px; border-radius:8px; font-weight:bold; cursor:pointer; }
        .tab-btn.active { border-color:var(--cyan); color:var(--cyan); background:rgba(0,240,255,0.1); }
        .panel { display:none; background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; }
        .panel.active { display:block; }
        .prio-switch { display:flex; background:var(--bg); border-radius:8px; padding:4px; margin-bottom:1rem; border:1px solid var(--border); }
        .prio-btn { flex:1; padding:10px; border:none; background:transparent; color:var(--muted); font-weight:bold; border-radius:6px; cursor:pointer; }
        .prio-btn.active { background:var(--cyan); color:#000; }
        .input-grid { display:grid; grid-template-columns:1fr 1fr; gap:1rem; margin-bottom:1rem; }
        .full { grid-column:1 / -1; }
        label { display:block; font-size:0.85rem; color:var(--muted); margin-bottom:4px; }
        input { background:var(--bg); border:1px solid var(--border); color:#fff; padding:12px; border-radius:8px; font-size:1.2rem; font-weight:bold; width:100%; }
        input:disabled { opacity:0.4; }
        .result-box { background:var(--bg); border:1px solid var(--cyan); border-radius:10px; padding:1.25rem; margin-top:1rem; }
        .big-result { font-size:1.5rem; font-weight:bold; margin:8px 0; }
        .big-result span { color:var(--green); }
        .disc-badge { display:inline-block; background:rgba(0,230,118,0.15); border:1px solid var(--green); color:var(--green); padding:6px 10px; border-radius:6px; font-weight:bold; margin:4px 4px 0 0; }
        .warn { color:var(--orange); font-weight:bold; }
        .dms-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-bottom:1rem; }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn">← FŐOLDAL</a>
        <div><strong>TEILAPPARAT PRO</strong></div>
    </header>
    <main>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('direkt', this)">DIREKT</button>
            <button class="tab-btn" onclick="switchTab('indirekt', this)">INDIREKT</button>
            <button class="tab-btn" onclick="switchTab('ausgleich', this)">AUSGLEICH</button>
        </div>

        <div id="direkt" class="panel active">
            <div class="prio-switch">
                <button class="prio-btn active" onclick="setPrio('direkt', 'winkel', this)">Winkel (°)</button>
                <button class="prio-btn" onclick="setPrio('direkt', 'teilzahl', this)">Teilzahl (Z)</button>
            </div>
            <div class="input-grid">
                <div><label>Winkel (°)</label><input type="number" id="dir_w" value="30" oninput="calcD()"></div>
                <div><label>Teilzahl (Z)</label><input type="number" id="dir_z" value="12" disabled oninput="calcD()"></div>
                <div class="full"><label>Löcher d. Teilscheibe</label><input type="number" id="dir_l" value="24" oninput="calcD()"></div>
            </div>
            <div class="result-box" id="dir_res"></div>
        </div>

        <div id="indirekt" class="panel">
            <label>Grad / Min / Sek Umrechner</label>
            <div class="dms-grid">
                <input type="number" id="dms_g" value="19" oninput="calcDMS()">
                <input type="number" id="dms_m" value="10" oninput="calcDMS()">
                <input type="number" id="dms_s" value="0" oninput="calcDMS()">
            </div>
            <div class="prio-switch">
                <button class="prio-btn active" onclick="setPrio('indirekt', 'winkel', this)">Winkel (°)</button>
                <button class="prio-btn" onclick="setPrio('indirekt', 'teilzahl', this)">Teilzahl (Z)</button>
            </div>
            <div class="input-grid">
                <div><label>Winkel (Dezimal)</label><input type="number" id="ind_w" value="19.16667" oninput="calcI()"></div>
                <div><label>Teilzahl (Z)</label><input type="number" id="ind_z" value="30" disabled oninput="calcI()"></div>
                <div class="full"><label>Übersetzung (i)</label><input type="number" id="ind_i" value="40" oninput="calcI()"></div>
            </div>
            <div class="result-box" id="ind_res"></div>
        </div>

        <div id="ausgleich" class="panel">
            <div class="prio-switch">
                <button class="prio-btn" onclick="setPrio('ausgleich', 'winkel', this)">Winkel (°)</button>
                <button class="prio-btn active" onclick="setPrio('ausgleich', 'teilzahl', this)">Teilzahl (Z)</button>
            </div>
            <div class="input-grid">
                <div><label>Winkel (°)</label><input type="number" id="aus_w" value="31.25" disabled oninput="calcA()"></div>
                <div><label>Teilzahl (Z)</label><input type="number" id="aus_z" value="127" oninput="calcA()"></div>
                <div><label>Hilfsteilzahl (Z')</label><input type="number" id="aus_zh" value="132" oninput="calcA()"></div>
                <div><label>Übersetzung (i)</label><input type="number" id="aus_i" value="40" oninput="calcA()"></div>
            </div>
            <div class="result-box" id="aus_res"></div>
        </div>
    </main>
