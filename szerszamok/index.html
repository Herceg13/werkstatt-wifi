<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kéziszerszámok // WERKSTATT OS</title>
    <style>
        :root { --bg:#060a0f; --panel:#0b111a; --card:rgba(12,22,34,0.88); --cyan:#00f0ff; --orange:#ff7b00; --green:#00e676; --text:#e6edf3; --muted:#7f92a6; --border:rgba(0,240,255,0.35); }
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',Roboto,sans-serif; }
        body { background:radial-gradient(circle at 50% 0%,#0f1e2e 0%,var(--bg) 70%); color:var(--text); min-height:100vh; padding-bottom:3rem; }
        header { background:var(--panel); border-bottom:1px solid var(--border); padding:1rem 1.25rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
        .back-btn { color:var(--cyan); text-decoration:none; font-weight:700; padding:8px 14px; border:1px solid var(--cyan); border-radius:6px; background:rgba(0,240,255,0.08); }
        main { max-width:950px; margin:0 auto; padding:1.25rem; }
        .search-box { width:100%; padding:14px 16px; background:var(--panel); border:1px solid var(--border); border-radius:8px; color:#fff; font-size:1rem; margin-bottom:1rem; outline:none; }
        .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; margin-bottom:1rem; }
        .add-row { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin-bottom:1.25rem; }
        input { padding:11px; background:#070d14; border:1px solid var(--border); border-radius:8px; color:#fff; font-size:0.95rem; }
        .btn { background:rgba(0,230,118,0.15); border:1px solid var(--green); color:var(--green); padding:0 16px; border-radius:8px; font-weight:800; cursor:pointer; }
        .t-item { display:flex; justify-content:space-between; align-items:center; padding:10px 12px; background:#070d14; border:1px solid rgba(255,255,255,0.08); border-radius:8px; margin-bottom:8px; }
        .loc-tag { color:var(--orange); font-size:0.82rem; font-weight:800; }
        @media (max-width:600px) { .add-row { grid-template-columns:1fr; } .btn { padding:12px; } }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn">← FŐOLDAL</a>
        <div style="text-align:right;">
            <div style="font-weight:800; letter-spacing:1px;">KÉZISZERSZÁMOK <span style="color:var(--cyan);">// PRO</span></div>
            <div style="font-size:0.75rem; color:var(--muted);">Célszerszámok & Műhelyi Leltár</div>
        </div>
    </header>
    <main>
        <input type="text" id="q" class="search-box" placeholder="🔍 Szerszám vagy hely keresése (pl. nyomatékkulcs, lehúzó, szekrény)..." oninput="render()">
        <div class="card">
            <div style="font-size:0.85rem; color:var(--cyan); font-weight:800; margin-bottom:8px;">➕ Új célszerszám / mérőeszköz felvétele:</div>
            <div class="add-row">
                <input type="text" id="tName" placeholder="Szerszám neve (pl. Csapágylehúzó 3-karú)">
                <input type="text" id="tLoc" placeholder="Helye (pl. Műhely fal / 2-es szekrény)">
                <button class="btn" onclick="addTool()">+ Mentés</button>
            </div>
            <div id="toolList"></div>
        </div>
    </main>
    <script>
        const DEFAULT_TOOLS = [
            { name: "Nyomatékkulcs (40 – 200 Nm, 1/2\")", loc: "Szerszámos szekrény" },
            { name: "Tolómérő & Mikrométer készlet (0–100 mm)", loc: "Mérőeszköz fiók" },
            { name: "Csapágylehúzó készlet (2 és 3 karú)", loc: "Műhely szerszámfal" }
        ];
        let tools = JSON.parse(localStorage.getItem('bb_tools_v1')) || DEFAULT_TOOLS;
        function addTool() {
            const name = document.getElementById('tName').value.trim();
            const loc = document.getElementById('tLoc').value.trim() || 'Műhely';
            if (!name) return;
            tools.unshift({ name, loc });
            localStorage.setItem('bb_tools_v1', JSON.stringify(tools));
            document.getElementById('tName').value = '';
            document.getElementById('tLoc').value = '';
            render();
        }
        function render() {
            const q = document.getElementById('q').value.toLowerCase().trim();
            document.getElementById('toolList').innerHTML = tools.filter(t => `${t.name} ${t.loc}`.toLowerCase().includes(q)).map(t =>
                `<div class="t-item"><strong>🔧 ${t.name}</strong><span class="loc-tag">📍 ${t.loc}</span></div>`
            ).join('');
        }
        render();
    </script>
</body>
</html>
