<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transportbänder & Riemen // WERKSTATT OS</title>
    <style>
        :root { --bg:#060a0f; --panel:#0b111a; --card:rgba(14,24,38,0.88); --cyan:#00f0ff; --orange:#ff7b00; --red:#ff2a55; --green:#00e676; --text:#e6edf3; --muted:#8b949e; --border:rgba(0,240,255,0.3); }
        * { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',Roboto,sans-serif; }
        body { background:var(--bg); color:var(--text); min-height:100vh; padding-bottom:3rem; }
        header { background:var(--panel); border-bottom:1px solid var(--border); padding:1rem 1.25rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
        .back-btn { color:var(--cyan); text-decoration:none; font-weight:700; padding:7px 12px; border:1px solid var(--cyan); border-radius:6px; background:rgba(0,240,255,0.08); }
        main { max-width:1100px; margin:0 auto; padding:1.25rem; }
        .stats { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:1.25rem; }
        .stat-box { background:var(--panel); border:1px solid rgba(255,255,255,0.1); border-radius:8px; padding:12px; text-align:center; }
        .stat-num { font-size:1.4rem; font-weight:800; color:var(--cyan); }
        .stat-num.alert { color:var(--red); }
        .stat-lbl { font-size:0.75rem; color:var(--muted); text-transform:uppercase; }
        .search-box { width:100%; padding:14px 16px; background:var(--panel); border:1px solid var(--border); border-radius:8px; color:#fff; font-size:1rem; margin-bottom:1rem; outline:none; }
        .filter-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; margin-bottom:1.25rem; }
        .f-btn { background:var(--panel); border:1px solid rgba(255,255,255,0.15); color:var(--muted); padding:8px 14px; border-radius:6px; font-weight:700; font-size:0.85rem; cursor:pointer; white-space:nowrap; }
        .f-btn.active { background:rgba(0,240,255,0.15); border-color:var(--cyan); color:var(--cyan); }
        .f-btn.red-btn.active { background:rgba(255,42,85,0.2); border-color:var(--red); color:var(--red); }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:1rem; }
        .card { background:var(--card); border:1px solid rgba(0,240,255,0.22); border-radius:10px; padding:1.2rem; display:flex; flex-direction:column; justify-content:space-between; }
        .card.low { border-color:var(--red); box-shadow:inset 0 0 15px rgba(255,42,85,0.12); }
        .c-head { display:flex; justify-content:space-between; align-items:flex-start; gap:8px; margin-bottom:8px; }
        .machine-badge { background:rgba(0,240,255,0.15); color:var(--cyan); font-weight:800; font-size:0.75rem; padding:3px 8px; border-radius:4px; }
        .size-title { font-size:1.25rem; font-weight:800; color:#fff; margin:4px 0; }
        .wo-sub { font-size:0.95rem; color:#cfd8e3; font-weight:600; margin-bottom:10px; }
        .specs { background:rgba(0,0,0,0.35); border-radius:6px; padding:8px 10px; font-size:0.82rem; color:var(--muted); display:flex; flex-direction:column; gap:4px; margin-bottom:12px; }
        .specs b { color:#e6edf3; }
        .keil-tag { color:var(--orange); font-weight:700; }
        .stock-bar { display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.08); padding-top:10px; }
        .stock-val { font-size:1.15rem; font-weight:800; }
        .ok-txt { color:var(--green); }
        .low-txt { color:var(--red); }
        .qty-btns { display:flex; gap:6px; }
        .q-btn { width:38px; height:38px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:#fff; font-size:1.2rem; font-weight:800; cursor:pointer; }
        .export-bar { margin-top:2rem; text-align:center; display:flex; gap:10px; justify-content:center; flex-wrap:wrap; }
        .act-btn { background:rgba(0,240,255,0.12); border:1px solid var(--cyan); color:var(--cyan); padding:12px 18px; border-radius:8px; font-weight:700; cursor:pointer; }
    </style>
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn">← FŐOLDAL</a>
        <div style="text-align:right;">
            <div style="font-weight:800; letter-spacing:1px;">TRANSPORTBÄNDER <span style="color:var(--cyan);">PRO</span></div>
            <div style="font-size:0.75rem; color:var(--muted);">BB Münchinger // Lager & Bestand</div>
        </div>
    </header>
    <main>
        <div class="stats">
            <div class="stat-box"><div class="stat-num" id="st_total">0</div><div class="stat-lbl">Összes típus</div></div>
            <div class="stat-box"><div class="stat-num alert" id="st_low">0</div><div class="stat-lbl">Rendelendő</div></div>
            <div class="stat-box"><div class="stat-num" style="color:var(--green);" id="st_ok">0</div><div class="stat-lbl">Rendben</div></div>
        </div>
        <input type="text" id="q" class="search-box" placeholder="🔍 Keresés méretre (3800x250), gépre (V1, KVZ, Opti)..." oninput="render()">
        <div class="filter-row">
            <button class="f-btn active" onclick="setF('all', this)">Összes (66)</button>
            <button class="f-btn red-btn" onclick="setF('low', this)">⚠️ Rendelendő</button>
            <button class="f-btn" onclick="setF('V1', this)">V1</button>
            <button class="f-btn" onclick="setF('V2', this)">V2</button>
            <button class="f-btn" onclick="setF('V4', this)">V4</button>
            <button class="f-btn" onclick="setF('KVZ', this)">KVZ 1/2</button>
            <button class="f-btn" onclick="setF('Opti', this)">Opti / Stapler</button>
            <button class="f-btn" onclick="setF('Riemen', this)">Riemen</button>
        </div>
        <div class="grid" id="list"></div>
        <div class="export-bar">
            <button class="act-btn" onclick="copyOrderList()">📋 Hiánylista másolása</button>
            <button class="act-btn" style="border-color:var(--muted); color:var(--muted);" onclick="resetData()">🔄 Eredeti készlet</button>
        </div>
    </main>

        const FULL_DEFAULT = RAW_DATA.concat(RAW_DATA_2);
        let items = JSON.parse(localStorage.getItem('bb_belts_v1')) || JSON.parse(JSON.stringify(FULL_DEFAULT));
        let curFilter = 'all';

        function save() { localStorage.setItem('bb_belts_v1', JSON.stringify(items)); }
        function setF(f, btn) { curFilter = f; document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }
        function chgQty(id, delta) { const it = items.find(x => x.id === id); if(it) { it.ist = Math.max(0, it.ist + delta); save(); render(); } }
        function resetData() { if(confirm('Visszaállítod az eredeti készletet?')) { items = JSON.parse(JSON.stringify(FULL_DEFAULT)); save(); render(); } }

        function copyOrderList() {
            const lows = items.filter(x => x.ist < x.soll);
            if(!lows.length) { alert('Minden készlet rendben van!'); return; }
            let txt = "BB MÜNCHINGER - BESTELLLISTE:\n\n";
            lows.forEach(x => { txt += `- ${x.m} | ${x.wo} | ${x.s} (${x.mat}) -> Fehlmenge: ${x.soll - x.ist} Stk.\n`; });
            navigator.clipboard.writeText(txt).then(() => alert('Hiánylista másolva!'));
        }

        function render() {
            const q = document.getElementById('q').value.toLowerCase();
            let lowCnt = 0, okCnt = 0;
            items.forEach(x => { if(x.ist < x.soll) lowCnt++; else okCnt++; });
            document.getElementById('st_total').innerText = items.length;
            document.getElementById('st_low').innerText = lowCnt;
            document.getElementById('st_ok').innerText = okCnt;

            const list = document.getElementById('list');
            list.innerHTML = '';
            items.filter(x => {
                const isLow = x.ist < x.soll;
                if(curFilter === 'low' && !isLow) return false;
                if(curFilter !== 'all' && curFilter !== 'low' && !x.m.toLowerCase().includes(curFilter.toLowerCase())) return false;
                return `${x.m} ${x.wo} ${x.s} ${x.mat} ${x.v} ${x.k} ${x.mit}`.toLowerCase().includes(q);
            }).forEach(x => {
                const isLow = x.ist < x.soll;
                list.innerHTML += `
                    <div class="card ${isLow ? 'low' : ''}">
                        <div>
                            <div class="c-head">
                                <span class="machine-badge">${x.m}</span>
                                <span style="font-size:0.75rem; color:${isLow?'var(--red)':'var(--green)'}; font-weight:700;">
                                    ${isLow ? '⚠️ RENDELENDŐ: ' + (x.soll - x.ist) + ' db' : '✅ RENDBEN'}
                                </span>
                            </div>
                            <div class="size-title">${x.s} mm</div>
                            <div class="wo-sub">${x.wo}</div>
                            <div class="specs">
                                <div>Anyag: <b>${x.mat}</b></div>
                                <div>Kötés / Cikkszám: <b>${x.v}</b></div>
                                ${x.k !== 'Nein' ? `<div class="keil-tag">Ék: ${x.k}</div>` : ''}
                                ${x.mit ? `<div style="color:var(--cyan);">Lapát: ${x.mit}</div>` : ''}
                            </div>
                        </div>
                        <div class="stock-bar">
                            <div>Készlet: <span class="stock-val ${isLow?'low-txt':'ok-txt'}">${x.ist}</span> <span style="color:var(--muted);">/ ${x.soll} db</span></div>
                            <div class="qty-btns">
                                <button class="q-btn" onclick="chgQty(${x.id}, -1)">-</button>
                                <button class="q-btn" onclick="chgQty(${x.id}, 1)">+</button>
                            </div>
                        </div>
                    </div>`;
            });
        }
        render();
    </script>
</body>
</html>
