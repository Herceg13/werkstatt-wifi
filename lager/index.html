<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ersatzteillager // WERKSTATT OS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="../index.html" class="back-btn">← FŐOLDAL</a>
        <div style="text-align:right;">
            <div style="font-weight:800; letter-spacing:1px;">ERSATZTEILLAGER <span style="color:var(--cyan);">// PRO</span></div>
            <div style="font-size:0.75rem; color:var(--muted);">Moduláris Raktár & Szkenner</div>
        </div>
    </header>
    <main>
        <div class="top-actions">
            <button class="scan-btn" id="scanToggleBtn" onclick="toggleScanner()">📷 BARCODE / POLC SZKENNELÉS</button>
            <button class="act-btn orange" onclick="startRelocateMode()">📦 Betárolás / Áthelyezés</button>
            <button class="act-btn green" onclick="openNewModal('')">➕ Új anyag felvétele</button>
        </div>
        <div id="modeBanner" class="mode-banner"></div>
        <div id="camBox"></div>
        <div class="search-row">
            <input type="text" id="q" class="search-box" placeholder="🔍 Keresés (kód, név, méret, polc — pl. A0081, 02-C4)..." oninput="render()">
            <button class="clear-btn" onclick="resetView()">✖</button>
        </div>
        <div id="catMenu" class="cat-grid"></div>
        <div id="itemSection" style="display:none;">
            <div class="sub-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button class="back-btn" onclick="backToCats()">← Kategóriák</button>
                    <strong id="curCatTitle" style="color:#fff; font-size:1.05rem;">Összes alkatrész</strong>
                </div>
                <button class="export-btn" onclick="copyMissingList()">📋 HIÁNYLISTA MÁSOLÁSA</button>
            </div>
            <div class="status-bar">
                <button class="st-btn active" id="stAll" onclick="setStatus('all', this)">Összes (0)</button>
                <button class="st-btn ok" id="stOk" onclick="setStatus('ok', this)">✅ Elérhető (0)</button>
                <button class="st-btn miss" id="stMiss" onclick="setStatus('miss', this)">⚠️ Hiány (0)</button>
            </div>
            <div class="grid" id="list"></div>
        </div>
    </main>

    <!-- Új anyag felvétele ablak -->
    <div id="newModal" class="modal">
        <div class="modal-box">
            <h3>➕ Új alkatrész felvétele</h3>
            <div class="f-grp"><label>Egyedi azonosító (automatikus)</label><input type="text" id="n_id" readonly style="color:var(--cyan);font-weight:900;"></div>
            <div class="f-grp"><label>Megnevezés / Méret *</label><input type="text" id="n_name" placeholder="pl. SKF Csapágy 6205 2RS"></div>
            <div class="f-grp"><label>Kiszerelés (Gebinde)</label><input type="text" id="n_geb" value="BOX"></div>
            <div class="f-grp"><label>Kategória</label>
                <select id="n_cat">
                    <option value="alkatresz">Alkatrészek & Motorok</option>
                    <option value="szalag">Szalagok & Szíjak</option>
                    <option value="buro">Zsírok, Spray & Büro</option>
                </select>
            </div>
            <div class="f-grp"><label>Polchely (H5ETL/...)</label>
                <div style="display:flex;gap:6px;">
                    <input type="text" id="n_loc" placeholder="pl. 03-D2">
                    <button class="act-btn" onclick="scanForNewLoc()">📷 Polc</button>
                </div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
                <div class="f-grp"><label>Kezdő készlet (db)</label><input type="number" id="n_ist" value="1"></div>
                <div class="f-grp"><label>Minimum készlet (db)</label><input type="number" id="n_min" value="1"></div>
            </div>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:0.5rem;">
                <button class="clear-btn" style="padding:12px;" onclick="closeNewModal()">Mégse</button>
                <button class="act-btn green" style="padding:12px;" onclick="saveNewItem()">💾 MENTÉS</button>
            </div>
        </div>
    </div>

    <script src="adatok.js"></script>
    <script src="szkenner.js"></script>
    <script src="muveletek.js"></script>
</body>
</html>
