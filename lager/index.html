        .scan-line { position:absolute; top:50%; left:10%; right:10%; height:2px; background:var(--red); box-shadow:0 0 8px var(--red); }
        .search-box { width:100%; padding:14px 16px; background:var(--panel); border:1px solid var(--border); border-radius:8px; color:#fff; font-size:1rem; margin-bottom:1rem; outline:none; }

        .f-btn { background:var(--panel); border:1px solid rgba(255,255,255,0.15); color:var(--muted); padding:8px 14px; border-radius:6px; font-weight:700; font-size:0.85rem; cursor:pointer; white-space:nowrap; }
        .f-btn.active { background:rgba(0,240,255,0.15); border-color:var(--cyan); color:var(--cyan); }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr)); gap:1rem; }
        .card { background:var(--card); border:1px solid rgba(0,240,255,0.22); border-radius:10px; padding:1.15rem; display:flex; flex-direction:column; justify-content:space-between; }
        .card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
        .id-badge { background:var(--cyan); color:#000; font-weight:900; font-size:0.85rem; padding:3px 9px; border-radius:4px; }
        .loc-badge { background:rgba(255,123,0,0.18); border:1px solid var(--orange); color:var(--orange); font-weight:800; font-size:0.8rem; padding:3px 9px; border-radius:4px; }
        .art-title { font-size:1.05rem; font-weight:700; color:#fff; margin-bottom:8px; line-height:1.35; }
        .art-meta { font-size:0.8rem; color:var(--muted); margin-bottom:12px; }
        .stock-bar { display:flex; justify-content:space-between; align-items:center; border-top:1px solid rgba(255,255,255,0.08); padding-top:10px; }
        .stock-val { font-size:1.2rem; font-weight:800; color:var(--green); }
        .stock-val.zero { color:var(--red); }

        .q-btn { width:40px; height:40px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:#fff; font-size:1.25rem; font-weight:800; cursor:pointer; }

        const FULL_LAGER = L1.concat(L2, L3);
        let items = JSON.parse(localStorage.getItem('bb_lager_v3')) || JSON.parse(JSON.stringify(FULL_LAGER));
        let curF = 'all', stream = null, scanTimer = null;

        function save() { localStorage.setItem('bb_lager_v3', JSON.stringify(items)); }
        function setF(f, btn) { curF = f; document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }
        function clearSearch() { document.getElementById('q').value = ''; render(); }
        function chg(id, d) { const it = items.find(x => x.id === id); if(it) { it.ist = Math.max(0, it.ist + d); save(); render(); } }

                        let stream = null, scanTimer = null;

        async function toggleScanner() {
            const box = document.getElementById('camBox'), vid = document.getElementById('vid'), b = document.getElementById('scanToggleBtn');
            if (stream) {
                stream.getTracks().forEach(t => t.stop());
                stream = null; clearInterval(scanTimer);
                box.style.display = 'none';
                b.innerText = '📷 BARCODE / H5ETL POLC SZKENNELÉS';
                return;
            }
            try {
                stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
                vid.srcObject = stream;
                box.style.display = 'block';
                b.innerText = '⏹ KAMERA BEZÁRÁSA';

                if ('BarcodeDetector' in window) {
                    const detector = new BarcodeDetector();
                    scanTimer = setInterval(async () => {
                        try {
                            const codes = await detector.detect(vid);
                            if (codes.length > 0) {
                                const clean = codes[0].rawValue.trim().replace(/^H5ETL\//i, '');
                                document.getElementById('q').value = clean;
                                render();
                                toggleScanner();
                            }
                        } catch (e) {}
                    }, 300);
                }
            } catch (err) {
                alert("Kamera nem elérhető ezen az eszközön: " + err.message);
            }
        }

        function render() {
            const q = document.getElementById('q').value.toLowerCase().trim().replace(/^h5etl\//, '');
            const list = document.getElementById('list');
            list.innerHTML = '';
            items.filter(x => {
                if(curF === 'stock' && x.ist <= 0) return false;
                if(curF !== 'all' && curF !== 'stock' && x.cat !== curF) return false;
                return `${x.id} ${x.name} ${x.loc} H5ETL/${x.loc} ${x.geb}`.toLowerCase().includes(q);
            }).forEach(x => {
                list.innerHTML += `
                    <div class="card">
                        <div>
                            <div class="card-top">
                                <span class="id-badge">${x.id}</span>
                                <span class="loc-badge">📍 H5ETL/${x.loc}</span>
                            </div>
                            <div class="art-title">${x.name}</div>
                            <div class="art-meta">Kiszerelés: <b>${x.geb}</b></div>
                        </div>
                        <div class="stock-bar">
                            <div>Készlet: <span class="stock-val ${x.ist===0?'zero':''}">${x.ist}</span> db</div>
                            <div class="qty-btns">
                                <button class="q-btn" onclick="chg('${x.id}', -1)">-</button>
                                <button class="q-btn" onclick="chg('${x.id}', 1)">+</button>
                            </div>
                        </div>
                    </div>`;
            });
        }
        render();
    </script>
