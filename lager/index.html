        header { background:var(--panel); border-bottom:1px solid var(--border); padding:0.9rem 1.25rem; display:flex; justify-content:space-between; align-items:center; position:sticky; top:0; z-index:100; }
        .back-btn { color:var(--cyan); text-decoration:none; font-weight:700; padding:8px 13px; border:1px solid var(--cyan); border-radius:6px; background:rgba(0,240,255,0.08); cursor:pointer; font-size:0.88rem; }
        main { max-width:1100px; margin:0 auto; padding:1.1rem; }
        .scan-bar { display:flex; gap:8px; margin-bottom:0.85rem; }
        .scan-btn { flex:1; background:linear-gradient(90deg, rgba(0,240,255,0.22), rgba(0,240,255,0.08)); border:1px solid var(--cyan); color:var(--cyan); padding:13px; border-radius:8px; font-size:0.95rem; font-weight:800; cursor:pointer; }
        .clear-btn { background:var(--panel); border:1px solid rgba(255,255,255,0.2); color:var(--muted); padding:0 14px; border-radius:8px; font-weight:700; cursor:pointer; }
        #camBox { display:none; max-width:480px; margin:0 auto 1rem; border:2px solid var(--cyan); border-radius:10px; overflow:hidden; background:#000; }
        .search-box { width:100%; padding:14px 16px; background:var(--panel); border:1px solid var(--border); border-radius:8px; color:#fff; font-size:1rem; margin-bottom:1.15rem; outline:none; }
        .search-box:focus { border-color:var(--cyan); box-shadow:0 0 15px rgba(0,240,255,0.25); }
        .cat-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:1rem; }
        .cat-card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:1.25rem; cursor:pointer; transition:0.2s; display:flex; flex-direction:column; justify-content:space-between; }
        .cat-card:hover { transform:translateY(-2px); border-color:var(--cyan); box-shadow:0 0 20px rgba(0,240,255,0.22); }
        .cat-card-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:0.6rem; }
        .cat-card h3 { font-size:1.15rem; color:#fff; margin-bottom:0.35rem; }
        .cat-card p { font-size:0.83rem; color:var(--muted); margin-bottom:0.9rem; line-height:1.4; }
        .cat-stats { display:flex; justify-content:space-between; font-size:0.8rem; font-weight:800; border-top:1px solid rgba(255,255,255,0.08); padding-top:0.7rem; }
        .sub-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; background:rgba(12,22,34,0.9); border:1px solid var(--border); padding:0.75rem 1rem; border-radius:8px; margin-bottom:0.85rem; }
        .export-btn { background:rgba(255,42,85,0.16); border:1px solid var(--red); color:#ff6b8b; padding:8px 12px; border-radius:6px; font-weight:800; font-size:0.82rem; cursor:pointer; }
        .export-btn:hover { background:var(--red); color:#fff; }
        .status-bar { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; margin-bottom:1.15rem; }
        .st-btn { background:var(--panel); border:1px solid rgba(255,255,255,0.15); color:var(--muted); padding:11px 8px; border-radius:8px; font-weight:800; font-size:0.85rem; cursor:pointer; text-align:center; }
        .st-btn.active { background:rgba(0,240,255,0.16); border-color:var(--cyan); color:var(--cyan); }
        .st-btn.ok.active { background:rgba(0,230,118,0.15); border-color:var(--green); color:var(--green); }
        .st-btn.miss.active { background:rgba(255,42,85,0.2); border-color:var(--red); color:#fff; }
        .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(315px,1fr)); gap:1rem; }
        .card { background:var(--card); border:1px solid rgba(0,230,118,0.35); border-radius:10px; padding:1.1rem; display:flex; flex-direction:column; justify-content:space-between; }
        .card.missing { border:1px solid rgba(255,42,85,0.7); background:linear-gradient(180deg, rgba(45,12,22,0.55) 0%, rgba(14,24,38,0.95) 100%); }
        .card-top { display:flex; justify-content:space-between; align-items:center; gap:6px; margin-bottom:8px; flex-wrap:wrap; }
        .id-badge { background:var(--cyan); color:#000; font-weight:900; font-size:0.82rem; padding:3px 8px; border-radius:4px; }
        .miss-badge { background:var(--red); color:#fff; font-weight:900; font-size:0.72rem; padding:3px 8px; border-radius:4px; }
        .ok-badge { background:rgba(0,230,118,0.15); border:1px solid var(--green); color:var(--green); font-weight:800; font-size:0.72rem; padding:2px 7px; border-radius:4px; }
        .loc-badge { background:rgba(255,123,0,0.18); border:1px solid var(--orange); color:var(--orange); font-weight:800; font-size:0.78rem; padding:3px 8px; border-radius:4px; }
        .art-title { font-size:1.02rem; font-weight:700; color:#fff; margin-bottom:5px; line-height:1.35; }
        .art-meta { font-size:0.8rem; color:var(--muted); margin-bottom:10px; }
        .stock-box { border-top:1px solid rgba(255,255,255,0.08); padding-top:10px; display:flex; flex-direction:column; gap:8px; }
        .stock-row { display:flex; justify-content:space-between; align-items:center; }
        .stock-val { font-size:1.2rem; font-weight:900; color:var(--green); }
        .stock-val.low { color:var(--red); }
        .min-val { font-size:1rem; font-weight:800; color:var(--orange); }
        .qty-btns { display:flex; gap:5px; }
        .q-btn { width:36px; height:34px; border-radius:6px; border:1px solid var(--border); background:var(--panel); color:#fff; font-size:1.15rem; font-weight:800; cursor:pointer; }
        .q-btn.min-b { border-color:rgba(255,123,0,0.45); color:var(--orange); }
    </style>
</head>

    <header>
        <a href="../index.html" class="back-btn">← FŐOLDAL</a>
        <div style="text-align:right;">
            <div style="font-weight:800; letter-spacing:1px;">ERSATZTEILLAGER <span style="color:var(--cyan);">// PRO</span></div>

    <main>
        <div class="scan-bar">
            <button class="scan-btn" id="scanToggleBtn" onclick="toggleScanner()">📷 BARCODE / POLC SZKENNELÉS</button>
            <button class="clear-btn" onclick="resetView()">✖ Törlés</button>
        </div>
        <div id="camBox"></div>
        <input type="text" id="q" class="search-box" placeholder="🔍 Villámkereső (kód, név, méret, polc — pl. A0081, 02-C4, 3800x250, Grease)..." oninput="render()">
        <div id="catMenu" class="cat-grid"></div>
        <div id="itemSection" style="display:none;">
            <div class="sub-header">
                <div style="display:flex; align-items:center; gap:10px;">
                    <button class="back-btn" onclick="backToCats()">← Kategóriák</button>
                    <strong id="curCatTitle" style="color:#fff; font-size:1.05rem;">Összes alkatrész</strong>
                </div>
                <button class="export-btn" onclick="copyMissingList()">📋 HIÁNYLISTA MÁSOLÁSA</button>
            </div>
            <div class="status-bar">
                <button class="st-btn active" id="stAll" onclick="setStatus('all', this)">Összes (0)</button>
                <button class="st-btn ok" id="stOk" onclick="setStatus('ok', this)">✅ Elérhető (0)</button>
                <button class="st-btn miss" id="stMiss" onclick="setStatus('miss', this)">⚠️ Hiány (0)</button>
            </div>
            <div class="grid" id="list"></div>
        </div>
    </main>

            {id:"A0138", name:"Saalbesen Holz 100 cm", geb:"BOX", ist:0, min:1, loc:"BÜRO", cat:"buro"},
            {id:"A0139", name:"Handbesen", geb:"BOX", ist:0, min:1, loc:"BÜRO", cat:"buro"},
            {id:"A0140", name:"Heizkörperpinsel, reine, helle Chinaborste", geb:"BOX", ist:0, min:1, loc:"BÜRO", cat:"buro"},
            {id:"A0141", name:"Leichtmetall Schaufel mit Stiel (Größe 9)", geb:"Boden", ist:0, min:1, loc:"BÜRO", cat:"buro"},
            {id:"A0142", name:"Gerätestiel 1800mm 28-30 mm", geb:"Boden", ist:0, min:1, loc:"BÜRO", cat:"buro"},
            {id:"A0143", name:"(Hand) Metall-Kehrblech mit Holzgriff", geb:"BOX", ist:0, min:1, loc:"BÜRO", cat:"buro"},
            {id:"A0144", name:"AVIA PROGREASE-L 2 EP (Hobel Gegenlager & Hobelkopf)", geb:"400 g Kartusche", ist:0, min:2, loc:"BÜRO", cat:"buro"}
        ];
        const FULL_LAGER = L1.concat(L2);
        let items = JSON.parse(localStorage.getItem('bb_lager_v11')) || JSON.parse(JSON.stringify(FULL_LAGER));
        let curCat = null;
        let curStatus = 'all';
        let html5QrCode = null;
        let isScanning = false;

        const CATS = [
            { id: 'all', icon: '📦', title: 'Összes alkatrész', desc: 'Teljes H5ETL raktárkészlet áttekintése egyben.' },
            { id: 'szalag', icon: '🎞️', title: 'Szalagok & Szíjak', desc: 'Szállítószalagok, lapos- és fogasszíjak adatbázisa.' },
            { id: 'buro', icon: '🛢️', title: 'Zsírok, Spray & Büro', desc: 'Kenőanyagok, ragasztók, tisztítók és műhelyi fogyóanyagok.' },
            { id: 'alkatresz', icon: '⚙️', title: 'Alkatrészek & Motorok', desc: 'Hengerek, szelepek, szűrők, hajtóművek és gépelemek.' }
        ];

        function isMissing(x) { return x.ist === 0 || x.ist < x.min; }
        function save() { localStorage.setItem('bb_lager_v11', JSON.stringify(items)); }
        function openCat(catId) { curCat = catId; curStatus = 'all'; document.querySelectorAll('.st-btn').forEach(b => b.classList.remove('active')); document.getElementById('stAll').classList.add('active'); render(); }
        function backToCats() { curCat = null; document.getElementById('q').value = ''; render(); }
        function resetView() { document.getElementById('q').value = ''; curCat = null; render(); }
        function setStatus(st, btn) { curStatus = st; document.querySelectorAll('.st-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active'); render(); }
        function chgIst(id, d) { const it = items.find(x => x.id === id); if(it) { it.ist = Math.max(0, it.ist + d); save(); render(); } }
        function chgMin(id, d) { const it = items.find(x => x.id === id); if(it) { it.min = Math.max(0, (it.min || 0) + d); save(); render(); } }

        function copyMissingList() {
            const q = document.getElementById('q').value.toLowerCase().trim().replace(/^h5etl\//, '');
            const activeCatObj = CATS.find(c => c.id === curCat) || CATS;
            const missing = items.filter(x => {
                if (!isMissing(x)) return false;
                if (curCat && curCat !== 'all' && x.cat !== curCat) return false;
                return `${x.id} ${x.name} ${x.loc} H5ETL/${x.loc} ${x.geb}`.toLowerCase().includes(q);
            });
            if (!missing.length) { alert(`✅ Nincs hiányzó tétel itt: ${activeCatObj.title}!`); return; }
            const header = `BB MÜNCHINGER // BESTELLUNG – ${activeCatObj.title.toUpperCase()}\nLieferant: ??? | Rendelendő tételek: ${missing.length} db\n----------------------------------------\n`;
            const body = missing.map(x => {
                const need = Math.max(1, x.min - x.ist);
                return `• [${x.id}] ${x.name} (${x.geb}) | Készlet: ${x.ist}/${x.min} db (Rendelendő: min. ${need} db) — H5ETL/${x.loc}`;
            }).join('\n');
            navigator.clipboard.writeText(header + body).then(() => alert(`📋 ${missing.length} hiányzó tétel vágólapra másolva (${activeCatObj.title})!`));
        }

        function loadScanLib() {
            return new Promise((resolve, reject) => {
                if (window.Html5Qrcode) { resolve(); return; }
                const s = document.createElement('script');
                s.src = ['https://cdn.jsd', 'elivr.net/npm/', 'html5-qrcode@2.3.8/', 'html5-qrcode.min.js'].join('');
                s.onload = resolve;
                s.onerror = reject;
                document.head.appendChild(s);
            });
        }

        async function stopCam() {
            if (html5QrCode && isScanning) {
                try { await html5QrCode.stop(); html5QrCode.clear(); } catch (e) {}
            }
            isScanning = false;
            document.getElementById('camBox').style.display = 'none';
            document.getElementById('scanToggleBtn').innerText = '📷 BARCODE / POLC SZKENNELÉS';
        }

        async function toggleScanner() {
            const box = document.getElementById('camBox'), btn = document.getElementById('scanToggleBtn');
            if (isScanning) { await stopCam(); return; }
            btn.innerText = '⏳ SZKENNER BETÖLTÉSE...';
            try {
                await loadScanLib();
                box.style.display = 'block';
                html5QrCode = new Html5Qrcode("camBox");
                await html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 15, qrbox: { width: 280, height: 110 } },
                    (decodedText) => {
                        document.getElementById('q').value = decodedText.trim().replace(/^H5ETL\//i, '');
                        render(); stopCam();
                    },
                    () => {}
                );
                isScanning = true;
                btn.innerText = '⏹ KAMERA BEZÁRÁSA';
            } catch (err) {
                await stopCam();
                alert("Kamera / Hálózat hiba: " + err);
            }
        }

        function render() {
            const q = document.getElementById('q').value.toLowerCase().trim().replace(/^h5etl\//, '');
            const catMenu = document.getElementById('catMenu');
            const itemSection = document.getElementById('itemSection');
            if (!curCat && !q) {
                catMenu.style.display = 'grid'; itemSection.style.display = 'none';
                catMenu.innerHTML = CATS.map(c => {
                    const sub = c.id === 'all' ? items : items.filter(x => x.cat === c.id);
                    const missCount = sub.filter(x => isMissing(x)).length;
                    const okCount = sub.length - missCount;
                    return `<div class="cat-card" onclick="openCat('${c.id}')"><div><div class="cat-card-top"><span style="font-size:1.6rem;">${c.icon}</span><span style="font-size:0.75rem; font-weight:800; color:var(--cyan);">${sub.length} TÉTEL</span></div><h3>${c.title}</h3><p>${c.desc}</p></div><div class="cat-stats"><span style="color:var(--green);">✅ ${okCount} OK</span><span style="color:var(--red);">⚠️ ${missCount} HIÁNY</span></div></div>`;
                }).join('');
                return;
            }
            catMenu.style.display = 'none'; itemSection.style.display = 'block';
            const activeCatObj = CATS.find(c => c.id === curCat) || CATS;
            document.getElementById('curCatTitle').innerText = q ? `Keresés: "${q}"` : activeCatObj.title;
            const baseList = items.filter(x => {
                if (curCat && curCat !== 'all' && x.cat !== curCat) return false;
                return `${x.id} ${x.name} ${x.loc} H5ETL/${x.loc} ${x.geb}`.toLowerCase().includes(q);
            });
            const totalC = baseList.length;
            const missC = baseList.filter(x => isMissing(x)).length;
            const okC = totalC - missC;
            document.getElementById('stAll').innerText = `Összes tétel (${totalC})`;
            document.getElementById('stOk').innerText = `✅ Elérhető (${okC})`;
            document.getElementById('stMiss').innerText = `⚠️ Hiány (${missC})`;
            const filtered = baseList.filter(x => {
                if (curStatus === 'ok') return !isMissing(x);
                if (curStatus === 'miss') return isMissing(x);
                return true;
            });
            document.getElementById('list').innerHTML = filtered.map(x => {
                const isLow = isMissing(x);
                return `<div class="card ${isLow ? 'missing' : ''}"><div><div class="card-top"><div style="display:flex;gap:6px;align-items:center;"><span class="id-badge">${x.id}</span>${isLow ? '<span class="miss-badge">HIÁNYZIK</span>' : '<span class="ok-badge">RENDBEN</span>'}</div><span class="loc-badge">📍 H5ETL/${x.loc}</span></div><div class="art-title">${x.name}</div><div class="art-meta">Kiszerelés: <b>${x.geb}</b></div></div><div class="stock-box"><div class="stock-row"><div>Készlet: <span class="stock-val ${isLow?'low':''}">${x.ist}</span> db</div><div class="qty-btns"><button class="q-btn" onclick="chgIst('${x.id}', -1)">-</button><button class="q-btn" onclick="chgIst('${x.id}', 1)">+</button></div></div><div class="stock-row"><div>Minimum: <span class="min-val">${x.min}</span> db</div><div class="qty-btns"><button class="q-btn min-b" onclick="chgMin('${x.id}', -1)">-</button><button class="q-btn min-b" onclick="chgMin('${x.id}', 1)">+</button></div></div></div></div>`;
            }).join('');
        }
        render();
    </script>
